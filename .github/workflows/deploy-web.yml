name: Deploy Web App

on:
  push:
    branches:
      - master
      - feature/**
      - bugfix/**
      - experiment/**
      - release/**
    tags:
      - "*"
  delete:
  workflow_dispatch:
    inputs:
      deployment_path:
        description: "Optional deployment path override"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Web App
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine deployment path
        id: path
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.deployment_path }}" ]; then
            DEPLOY_PATH="${{ github.event.inputs.deployment_path }}"
            UPDATE_LATEST="false"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            DEPLOY_PATH="$VERSION"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              UPDATE_LATEST="true"
            else
              UPDATE_LATEST="false"
            fi
          elif [ "${{ github.ref_name }}" = "master" ]; then
            DEPLOY_PATH="master"
            UPDATE_LATEST="false"
          else
            DEPLOY_PATH="${{ github.ref_name }}"
            DEPLOY_PATH="$(echo "$DEPLOY_PATH" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
            UPDATE_LATEST="false"
          fi

          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "update_latest=$UPDATE_LATEST" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $DEPLOY_PATH"
          echo "Update latest: $UPDATE_LATEST"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          VITE_APP_BACKEND: web
          VITE_APP_VERSION: ${{ steps.path.outputs.deploy_path }}
          VITE_APP_BUILD_LABEL: ${{ github.ref_name }}
        run: pnpm exec vite build

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages

      - name: Copy build to deployment path
        shell: bash
        run: |
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"

          rm -rf "pages/$DEPLOY_PATH"
          mkdir -p "pages/$DEPLOY_PATH"
          cp -R bundle/. "pages/$DEPLOY_PATH/"

      - name: Update latest stable deployment
        if: steps.path.outputs.update_latest == 'true'
        shell: bash
        run: |
          rm -rf pages/latest
          mkdir -p pages/latest
          cp -R bundle/. pages/latest/

      - name: Generate versions.json
        shell: bash
        run: |
          cd pages
          python3 - <<'EOF'
          import json, os, re

          entries = []
          dirs = [d for d in os.listdir('.') if os.path.isdir(d) and os.path.exists(os.path.join(d, 'index.html'))]

          if 'latest' in dirs:
              entries.append({"type": "stable", "name": "Latest Stable", "path": "./latest/", "notes": "Recommended for all users"})

          if 'master' in dirs:
              entries.append({"type": "master", "name": "master", "path": "./master/", "notes": "Latest development build"})

          semver_dirs = sorted(
              [d for d in dirs if re.match(r'^\d+\.\d+\.\d+$', d)],
              key=lambda v: [int(x) for x in v.split('.')],
              reverse=True
          )
          for d in semver_dirs:
              entries.append({"type": "release", "name": f"v{d}", "tag": f"v{d}", "path": f"./{d}/"})

          exclude = {'latest', 'master'} | set(semver_dirs)
          for d in sorted(d for d in dirs if d not in exclude):
              entries.append({"type": "branch", "name": d, "path": f"./{d}/"})

          with open('versions.json', 'w') as f:
              json.dump({"entries": entries}, f, indent=2)
              f.write('\n')
          EOF

      - name: Commit deployment
        shell: bash
        run: |
          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "deploy: ${{ steps.path.outputs.deploy_path }} from ${{ github.sha }}" || exit 0
          git push origin gh-pages

      - name: Print deployment URLs
        shell: bash
        run: |
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"

          echo "Deployment index: https://cfg.wingflight.org/"
          echo "Deployment: https://cfg.wingflight.org/$DEPLOY_PATH/"
          if [ "${{ steps.path.outputs.update_latest }}" = "true" ]; then
            echo "Latest stable: https://cfg.wingflight.org/latest/"
          fi

  cleanup-deleted-branch:
    name: Cleanup Deleted Branch Deployment
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages

      - name: Determine deployment path
        id: path
        shell: bash
        run: |
          DEPLOY_PATH="${{ github.event.ref }}"
          DEPLOY_PATH="$(echo "$DEPLOY_PATH" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"

          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "Deleting deployment path: $DEPLOY_PATH"

      - name: Delete deployment directory
        shell: bash
        run: |
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"

          if [ -d "pages/$DEPLOY_PATH" ]; then
            rm -rf "pages/$DEPLOY_PATH"
            echo "Deleted pages/$DEPLOY_PATH"
          else
            echo "No deployment found for pages/$DEPLOY_PATH"
          fi

      - name: Regenerate versions.json
        shell: bash
        run: |
          cd pages
          python3 - <<'EOF'
          import json, os, re

          entries = []
          dirs = [d for d in os.listdir('.') if os.path.isdir(d) and os.path.exists(os.path.join(d, 'index.html'))]

          if 'latest' in dirs:
              entries.append({"type": "stable", "name": "Latest Stable", "path": "./latest/", "notes": "Recommended for all users"})

          if 'master' in dirs:
              entries.append({"type": "master", "name": "master", "path": "./master/", "notes": "Latest development build"})

          semver_dirs = sorted(
              [d for d in dirs if re.match(r'^\d+\.\d+\.\d+$', d)],
              key=lambda v: [int(x) for x in v.split('.')],
              reverse=True
          )
          for d in semver_dirs:
              entries.append({"type": "release", "name": f"v{d}", "tag": f"v{d}", "path": f"./{d}/"})

          exclude = {'latest', 'master'} | set(semver_dirs)
          for d in sorted(d for d in dirs if d not in exclude):
              entries.append({"type": "branch", "name": d, "path": f"./{d}/"})

          with open('versions.json', 'w') as f:
              json.dump({"entries": entries}, f, indent=2)
              f.write('\n')
          EOF

      - name: Commit cleanup
        shell: bash
        run: |
          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "cleanup: remove deployment for deleted branch ${{ github.event.ref }}" || exit 0
          git push origin gh-pages
