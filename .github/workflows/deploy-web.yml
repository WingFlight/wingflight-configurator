name: Deploy Web App

on:
  push:
    branches:
      - master
      - feature/**
      - bugfix/**
      - experiment/**
      - release/**
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      deployment_path:
        description: "Optional deployment path override"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine deployment path
        id: path
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.deployment_path }}" ]; then
            DEPLOY_PATH="${{ github.event.inputs.deployment_path }}"
            UPDATE_LATEST="false"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            DEPLOY_PATH="$VERSION"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              UPDATE_LATEST="true"
            else
              UPDATE_LATEST="false"
            fi
          elif [ "${{ github.ref_name }}" = "master" ]; then
            DEPLOY_PATH="master"
            UPDATE_LATEST="false"
          else
            DEPLOY_PATH="${{ github.ref_name }}"
            DEPLOY_PATH="$(echo "$DEPLOY_PATH" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
            UPDATE_LATEST="false"
          fi

          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "update_latest=$UPDATE_LATEST" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $DEPLOY_PATH"
          echo "Update latest: $UPDATE_LATEST"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          VITE_APP_BACKEND: web
          VITE_APP_VERSION: ${{ steps.path.outputs.deploy_path }}
        run: pnpm exec vite build

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages

      - name: Copy build to deployment path
        shell: bash
        run: |
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"

          rm -rf "pages/$DEPLOY_PATH"
          mkdir -p "pages/$DEPLOY_PATH"
          cp -R bundle/. "pages/$DEPLOY_PATH/"

      - name: Update latest stable deployment
        if: steps.path.outputs.update_latest == 'true'
        shell: bash
        run: |
          rm -rf pages/latest
          mkdir -p pages/latest
          cp -R bundle/. pages/latest/

      - name: Generate deployment index
        shell: bash
        run: |
          cd pages

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '  <title>Wingflight Configurator Deployments</title>'
            echo '  <style>'
            echo '    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 3rem auto; max-width: 52rem; padding: 0 1rem; line-height: 1.5; }'
            echo '    h1 { margin-bottom: 0.25rem; }'
            echo '    .note { background: #eef6ff; border: 1px solid #b8dcff; border-radius: 0.5rem; padding: 1rem; }'
            echo '    li { margin: 0.35rem 0; }'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Wingflight Configurator Deployments</h1>'
            echo '  <p class="note">Web Serial requires a Chromium-based browser and HTTPS. GitHub Pages provides HTTPS automatically.</p>'
            echo '  <ul>'
            for dir in */ ; do
              name="${dir%/}"
              if [ -f "$dir/index.html" ]; then
                echo "    <li><a href=\"./$name/\">$name</a></li>"
              fi
            done | sort
            echo '  </ul>'
            echo '</body>'
            echo '</html>'
          } > index.html

      - name: Commit deployment
        shell: bash
        run: |
          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "deploy: ${{ steps.path.outputs.deploy_path }} from ${{ github.sha }}" || exit 0
          git push origin gh-pages

      - name: Print deployment URLs
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          DEPLOY_PATH="${{ steps.path.outputs.deploy_path }}"

          echo "Deployment index: https://$OWNER.github.io/$REPO/"
          echo "Deployment: https://$OWNER.github.io/$REPO/$DEPLOY_PATH/"
          if [ "${{ steps.path.outputs.update_latest }}" = "true" ]; then
            echo "Latest stable: https://$OWNER.github.io/$REPO/latest/"
          fi
