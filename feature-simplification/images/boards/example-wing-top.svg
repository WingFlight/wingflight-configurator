<svg xmlns="http://www.w3.org/2000/svg" width="60mm" height="38mm" viewBox="0 0 60 38">
  <!--
    A stand-in for a CAD export, used by tools/board-editor's worked
    example. The point it demonstrates is the sizing convention: the
    file declares its real size in millimetres (width="60mm"), so the
    editor can take the view's extent straight from it and every pad
    placed afterwards lands in real board coordinates.
    Export from your CAD tool at 1:1 with millimetre units and this
    works the same way.
  -->
  <rect x="0.3" y="0.3" width="59.4" height="37.4" rx="2.5"
        fill="#1d5b3a" stroke="#0d3421" stroke-width="0.3" />
  <g fill="none" stroke="#9fd9ba" stroke-width="0.18" opacity="0.6">
    <rect x="3" y="9" width="6" height="9" rx="0.6" />
    <rect x="3" y="19" width="6" height="9" rx="0.6" />
    <rect x="51" y="9" width="6" height="9" rx="0.6" />
    <rect x="2" y="31" width="56" height="6" rx="0.6" />
    <rect x="4" y="1.6" width="52" height="4.8" rx="0.6" />
  </g>
  <g fill="#0d3421">
    <rect x="23" y="15" width="14" height="10" rx="0.8" />
  </g>
  <g fill="#9fd9ba" opacity="0.85" font-family="sans-serif" font-size="2.4"
     text-anchor="middle">
    <text x="30" y="21.2">MCU</text>
  </g>
  <g fill="#c9c9c9">
    <circle cx="3" cy="3" r="1.5" />
    <circle cx="57" cy="3" r="1.5" />
    <circle cx="3" cy="35" r="1.5" />
    <circle cx="57" cy="35" r="1.5" />
  </g>
</svg>
