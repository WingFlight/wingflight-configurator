<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Wingflight configurator</title>
    <link type="text/css" rel="stylesheet" href="/feature-firmware-flash-backup-restore/assets/all.css" media="all"/>
  <script type="module" crossorigin src="/feature-firmware-flash-backup-restore/assets/src/main_cordova.html.js"></script>
  <link rel="modulepreload" crossorigin href="/feature-firmware-flash-backup-restore/assets/modulepreload-polyfill.js">
  <link rel="modulepreload" crossorigin href="/feature-firmware-flash-backup-restore/assets/rolldown-runtime.js">
  <link rel="modulepreload" crossorigin href="/feature-firmware-flash-backup-restore/assets/localization.js">
  <link rel="stylesheet" crossorigin href="/feature-firmware-flash-backup-restore/assets/main_cordova.css">
</head>
<body>
    <div id="headerbar">
        <img src="/feature-firmware-flash-backup-restore/images/light-wide-2-compact.svg" alt="" />
    </div>
    <div id="loading">
        <img src="/feature-firmware-flash-backup-restore/images/loading-spin.svg" alt="" />
        <p i18n="cordovaCheckingWebview"></p>
    </div>
    <div id="webview_troubleshooting">
        <div class="box">
            <div class="box_titlebar warning">
                <em class="fas fa-exclamation-triangle"></em> <span i18n="cordovaIncompatibleWebview"></span>
            </div>
            <div class="box_body">
                <p i18n="cordovaWebviewTroubleshootingMsg"></p>
                <p i18n="cordovaWebviewTroubleshootingMsg2"></p>
                <div class="divider"></div>
                <p id="webview_step_msg"></p>
                <button id="webview_step_btn1" class="btn" type="button"></button>
                <button id="webview_step_btn2" class="btn" type="button"></button>
            </div>
        </div>
        <div class="box">
            <div class="box_titlebar">
                <em class="fas fa-info-circle"></em> <span i18n="cordovaAvailableWebviews"></span>
            </div>
            <div class="box_body">
                <ul id="webview_apps"></ul>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="/feature-firmware-flash-backup-restore/assets/vendor/jquery.min.js"></script>
    <script type="text/javascript" src="/cordova.js"></script>
</body>
</html>
